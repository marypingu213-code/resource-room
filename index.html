<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 資源班出缺席與加分控制台</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* 🌟 上方導覽列按鈕 */
        .nav-tabs { display: flex; gap: 20px; margin-bottom: 20px; width: 100%; max-width: 95%; justify-content: center; }
        .nav-btn { background: #E0E0E0; color: #333; border: none; padding: 15px 30px; font-size: 28px; border-radius: 15px 15px 0 0; cursor: pointer; font-weight: bold; transition: 0.3s; border-bottom: 5px solid transparent; }
        .nav-btn.active { background: #fff; color: #4CAF50; border-bottom: 5px solid #4CAF50; }
        .export-btn { background: #FF9800; color: white; border: none; padding: 15px 30px; font-size: 28px; border-radius: 15px; cursor: pointer; font-weight: bold; margin-left: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; }
        .export-btn:hover { background: #F57C00; transform: translateY(-2px); }

        /* 視圖切換區塊 */
        .view-section { width: 100%; max-width: 95%; display: none; flex-direction: column; align-items: center; }
        .view-section.active { display: flex; }

        /* 第一頁：出缺席紀錄樣式 */
        #latest-scan { font-size: 60px; color: #4CAF50; font-weight: bold; height: 80px; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        .record-container { width: 100%; background: #fff; border-radius: 0 0 15px 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); padding: 30px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 28px; } 
        th, td { padding: 15px; border-bottom: 2px solid #eee; }
        th { background-color: #4CAF50; color: white; position: sticky; top: 0; }
        .status-in { color: #2196F3; font-weight: bold; }
        .status-out { color: #FF9800; font-weight: bold; }
        .duration-text { color: #757575; font-size: 24px; }
        .points-text { color: #E91E63; font-weight: bold; font-size: 30px; }

        /* 🌟 新增：注意事項公佈欄樣式 */
        .notice-board { background: #E8F5E9; border-left: 10px solid #4CAF50; padding: 20px 30px; margin-bottom: 30px; border-radius: 10px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 26px; color: #333; text-align: left; box-sizing: border-box; }
        .notice-board h3 { margin: 0 0 15px 0; color: #2E7D32; font-size: 32px; display: flex; align-items: center; }
        .notice-board ul { columns: 2; margin: 0; padding-left: 20px; line-height: 1.6; }
        .notice-board li { margin-bottom: 10px; font-weight: bold; color: #424242; }

        /* 第二頁：全班加分板樣式 */
        #all-students-panel { width: 100%; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; background: #fff; padding: 40px; border-radius: 0 0 15px 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); box-sizing: border-box;}
        .s-card { background: #FAFAFA; border-radius: 20px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); text-align: center; min-width: 200px; border-top: 8px solid #FFC107; transition: transform 0.2s; border: 1px solid #eee;}
        .s-card:hover { transform: translateY(-5px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .s-card h3 { margin: 0 0 10px 0; font-size: 32px; color: #333; }
        .s-card .pts { font-size: 40px; font-weight: bold; color: #E91E63; margin-bottom: 15px; }
        .btn-group { display: flex; justify-content: center; gap: 8px; }
        .btn-group button { padding: 12px 18px; font-size: 22px; border: none; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; }
        .btn-minus { background: #9E9E9E; }
        .btn-add1 { background: #4CAF50; }
        .btn-add5 { background: #2196F3; }
    </style>
</head>
<body>

    <div class="nav-tabs">
        <button class="nav-btn active" onclick="switchTab('view-attendance', this)">📝 出缺席紀錄</button>
        <button class="nav-btn" onclick="switchTab('view-points', this)">🎁 學生加分板</button>
        <button class="export-btn" onclick="exportToExcel()">📥 匯出今日報表 (Excel)</button>
    </div>

    <div id="view-attendance" class="view-section active">
        <div id="latest-scan">等待感應中...</div>
        <div class="record-container">
            <table>
                <thead>
                    <tr>
                        <th>時間</th>
                        <th>學生姓名</th>
                        <th>狀態</th>
                        <th>本次時數</th>
                        <th>獲得總分</th>
                    </tr>
                </thead>
                <tbody id="recordBody"></tbody>
            </table>
        </div>
    </div>

    <div id="view-points" class="view-section">
        <div class="notice-board">
            <h3>📌 資源班行事曆 & 注意事項</h3>
            <ul>
                <li>4/1 兒童、4/2 PT</li>
                <li>4/16 - 4/17 月考</li>
                <li>4/21 戶外、4/23 三戶外</li>
                <li>5/2 - 5/3 六月考</li>
                <li>6/15 畢 (香格)</li>
                <li>6/23 - 6/24 月考</li>
                <li>6/30 結 / 掃</li>
                <li>5月 雲門 (6/13、6/20)</li>
            </ul>
        </div>

        <div id="all-students-panel">
            </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAPFTAwM7yxBsUQ0NYcC7tMUBYna6em0XU", authDomain: "resource-room-a3986.firebaseapp.com", databaseURL: "https://resource-room-a3986-default-rtdb.firebaseio.com", projectId: "resource-room-a3986", storageBucket: "resource-room-a3986.firebasestorage.app", messagingSenderId: "76472526974", appId: "1:76472526974:web:7625a7719318206883d02f" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();

        const allStudents = [
            "宇軒", "睿穎", "楷元", "守恩", "書愷", "岷翰", "承熙",
            "盧楷", "意欣", "宇晴", "欽銓", "澄洋", "沄恩", "齊安"
        ];
        let currentPoints = {};

        function switchTab(viewId, btnElement) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            btnElement.classList.add('active');
        }

        function exportToExcel() {
            let csvContent = "\uFEFF"; 
            csvContent += "時間,學生姓名,狀態,本次時數,獲得總分\n"; 
            const rows = document.querySelectorAll('#recordBody tr');
            rows.forEach(row => {
                const cols = row.querySelectorAll('td');
                if(cols.length > 0) {
                    const time = cols[0].innerText;
                    const name = cols[1].innerText;
                    const status = cols[2].innerText;
                    const duration = cols[3].innerText.replace('-', '');
                    const points = cols[4].innerText.replace('🏆 ', '').replace(' 分', '').replace('-', '');
                    csvContent += `${time},${name},${status},${duration},${points}\n`;
                }
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            const dateStr = new Date().toLocaleDateString().replace(/\//g, '-');
            link.setAttribute("href", url);
            link.setAttribute("download", `資源班出缺席報表_${dateStr}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        const tbody = document.getElementById('recordBody');
        const latestScanDiv = document.getElementById('latest-scan');
        const pointsPanel = document.getElementById('all-students-panel');
        const now = new Date();
        const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

        function renderPointsPanel() {
            pointsPanel.innerHTML = ''; 
            allStudents.forEach(name => {
                const pts = currentPoints[name] || 0;
                const card = document.createElement('div');
                card.className = 's-card';
                card.innerHTML = `
                    <h3>${name}</h3>
                    <div class="pts">${pts} 分</div>
                    <div class="btn-group">
                        <button class="btn-minus" onclick="addPoint('${name}', -1)">-1</button>
                        <button class="btn-add1" onclick="addPoint('${name}', 1)">+1</button>
                        <button class="btn-add5" onclick="addPoint('${name}', 5)">+5</button>
                    </div>
                `;
                pointsPanel.appendChild(card);
            });
        }

        renderPointsPanel();

        db.ref('points').on('value', (snapshot) => {
            currentPoints = snapshot.val() || {};
            renderPointsPanel(); 
        });

        db.ref('attendance').orderByChild('timestamp').startAt(startOfDay).on('child_added', (snapshot) => {
            const data = snapshot.val();
            if (!data.timestamp) return;
            
            let durationHtml = `<span style="color: #ccc;">-</span>`;
            let pointsHtml = `<span style="color: #ccc;">-</span>`;
            let latestText = `👋 ${data.name} 已${data.status}！`;

            if (data.status === "下課" && data.duration) {
                durationHtml = `<span class="duration-text">${data.duration}</span>`;
                pointsHtml = `<span class="points-text">🏆 ${data.totalPoints || 0} 分</span>`;
                latestText = `👋 ${data.name} 已下課！(得 ${data.totalPoints || 0} 分)`;
            }
            
            latestScanDiv.innerText = latestText;
            latestScanDiv.style.color = data.status === "上課" ? "#2196F3" : "#FF9800";

            const row = document.createElement('tr');
            const statusClass = data.status === "上課" ? "status-in" : "status-out";

            row.innerHTML = `
                <td>${data.time}</td>
                <td>${data.name}</td>
                <td class="${statusClass}">${data.status}</td>
                <td>${durationHtml}</td>
                <td>${pointsHtml}</td>
            `;
            tbody.insertBefore(row, tbody.firstChild);
        });

        window.addPoint = function(name, ptsToAdd) {
            db.ref('points/' + name).once('value').then(snap => {
                let current = snap.val() || 0;
                let newVal = current + ptsToAdd;
                if (newVal < 0) newVal = 0; 
                db.ref('points/' + name).set(newVal);
            });
        };
    </script>
</body>
</html>
