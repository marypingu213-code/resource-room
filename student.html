<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 手機掃描端</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 50px 20px; background: #f4f7f6; margin: 0; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #333; margin-bottom: 30px;}
        #scan-btn { background: #4CAF50; color: white; border: none; padding: 20px 40px; font-size: 24px; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: background-color 0.3s;}
        #message { font-size: 24px; color: #4CAF50; font-weight: bold; margin-top: 30px; height: 35px;}
        .error-msg { color: #f44336 !important; }
    </style>
</head>
<body>
    <h1>📱 NFC 掃描器</h1>
    <button id="scan-btn">👉 點擊開始感應 NFC</button>
    <div id="message"></div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAPFTAwM7yxBsUQ0NYcC7tMUBYna6em0XU", authDomain: "resource-room-a3986.firebaseapp.com", databaseURL: "https://resource-room-a3986-default-rtdb.firebaseio.com", projectId: "resource-room-a3986", storageBucket: "resource-room-a3986.firebasestorage.app", messagingSenderId: "76472526974", appId: "1:76472526974:web:7625a7719318206883d02f" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();

        const studentNames = {
            "04:1a:bc:fa:1d:70:80": "宇軒", "04:16:bc:fa:1d:70:80": "睿穎", "04:2e:bc:fa:1d:70:80": "楷元", "04:2a:bc:fa:1d:70:80": "守恩",
            "04:26:bc:fa:1d:70:80": "書愷", "04:22:bc:fa:1d:70:80": "岷翰", "04:1e:bc:fa:1d:70:80": "承熙", "ff:0f:91:97:48:01:00": "盧楷",
            "ff:0f:90:97:48:01:00": "意欣", "ff:0f:36:96:48:01:00": "宇晴", "ff:0f:35:96:48:01:00": "欽銓", "ff:0f:32:96:48:01:00": "澄洋",
            "ff:0f:34:96:48:01:00": "沄恩", "ff:0f:33:96:48:01:00": "齊安"
        };

        const studentStatus = {};
        const checkInTimes = {}; 
        let lastScanSerialNumber = ""; let lastScanTime = 0;

        function playBeep() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.value = 1500; 
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        const scanBtn = document.getElementById('scan-btn');
        const msgDiv = document.getElementById('message');

        scanBtn.addEventListener('click', async () => {
            if (!("NDEFReader" in window)) { msgDiv.innerText = "❌ 你的設備不支援 NFC"; msgDiv.className = "error-msg"; return; }
            try {
                const ndef = new NDEFReader(); await ndef.scan();
                scanBtn.innerText = "📡 感應器開啟中..."; scanBtn.style.backgroundColor = "#2196F3";
                
                // 🌟 使用 async 確保能等待雲端資料抓取
                ndef.addEventListener("reading", async ({ serialNumber }) => {
                    const currentTime = new Date().getTime();
                    if (serialNumber === lastScanSerialNumber && (currentTime - lastScanTime) < 3000) return;

                    lastScanSerialNumber = serialNumber; lastScanTime = currentTime; playBeep();
                    const now = new Date();
                    const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0') + ':' + now.getSeconds().toString().padStart(2, '0');
                    const displayName = studentNames[serialNumber] || serialNumber;

                    let currentStatus = "上課";
                    let durationText = ""; let durationPoints = 0; let extraPoints = 0; let totalPoints = 0;

                    if (studentStatus[serialNumber] === "上課") {
                        currentStatus = "下課"; studentStatus[serialNumber] = "下課"; 
                        
                        if (checkInTimes[serialNumber]) {
                            let diffMs = currentTime - checkInTimes[serialNumber];
                            let diffMins = Math.floor(diffMs / 60000); 
                            let diffSecs = Math.floor((diffMs % 60000) / 1000); 
                            durationText = diffMins > 0 ? `${diffMins} 分 ${diffSecs} 秒` : `${diffSecs} 秒`;
                            
                            // 🌟 1. 計算時數分數 (時數 * 0.4 四捨五入)
                            durationPoints = Math.round(diffMins * 0.4); 
                            
                            // 🌟 2. 去雲端抓取老師在大電視給的加分
                            const ptSnap = await db.ref('points/' + displayName).once('value');
                            extraPoints = ptSnap.val() || 0;
                            
                            // 🌟 3. 計算總分
                            totalPoints = durationPoints + extraPoints;   
                        }
                        
                        // 下課後，將雲端上該學生的加分歸零，並把大電視上的卡片收起來
                        db.ref('points/' + displayName).set(0);

                    } else {
                        currentStatus = "上課"; studentStatus[serialNumber] = "上課"; 
                        checkInTimes[serialNumber] = currentTime; 
                        
                        // 上課時，確保雲端分數從 0 開始
                        db.ref('points/' + displayName).set(0);
                    }

                    msgDiv.innerText = `✅ 成功：${displayName} 已${currentStatus}`; msgDiv.className = "";
                    setTimeout(() => { if(msgDiv.innerText.includes(displayName)) msgDiv.innerText = ""; }, 3000);
                    
                    db.ref('attendance').push({
                        time: timeString, name: displayName, status: currentStatus,
                        duration: durationText, durationPoints: durationPoints,
                        extraPoints: extraPoints, totalPoints: totalPoints,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });
                });
            } catch (error) { msgDiv.innerText = `❌ 錯誤：${error.message}`; msgDiv.className = "error-msg"; }
        });
    </script>
</body>
</html>
